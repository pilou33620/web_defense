name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # le serveur : options, fichiers servis et refusés, garde, mise à jour par git (faux dépôt local)
      - name: Serveur (Rust)
        run: cargo test --locked -p defense
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Règles et cartes générées
        run: node tests/regles.test.mjs
      - name: Graphismes identiques à web_engine
        run: bash outils/maj-graphismes.sh --verifier
